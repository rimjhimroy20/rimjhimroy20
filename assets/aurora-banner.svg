<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180">
<defs>
  <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#2563EB"/><stop offset="50%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#06B6D4"/>
    <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="100%;0%;100%" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1200" height="180" rx="28" fill="#0B1020"/>
<ellipse cx="180" cy="90" rx="190" ry="70" fill="#2563EB" opacity=".22" filter="url(#blur)">
  <animate attributeName="cx" values="180;500;180" dur="7s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="600" cy="80" rx="220" ry="65" fill="#7C3AED" opacity=".20" filter="url(#blur)">
  <animate attributeName="cx" values="600;850;600" dur="9s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="1010" cy="100" rx="180" ry="65" fill="#06B6D4" opacity=".18" filter="url(#blur)">
  <animate attributeName="cx" values="1010;780;1010" dur="8s" repeatCount="indefinite"/>
</ellipse>
<path d="M0 120 C180 55 310 160 500 92 S820 25 1200 112" fill="none" stroke="url(#g)" stroke-width="3" opacity=".8">
  <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 120 C180 55 310 160 500 92 S820 25 1200 112;M0 90 C180 150 310 35 500 115 S820 155 1200 70;M0 120 C180 55 310 160 500 92 S820 25 1200 112"/>
</path>
<text x="600" y="92" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="700">Building • Learning • Creating</text>
<text x="600" y="124" text-anchor="middle" fill="#B8C7FF" font-family="Arial, sans-serif" font-size="15">A little color, a little motion, and lots of code 💙</text>
</svg>