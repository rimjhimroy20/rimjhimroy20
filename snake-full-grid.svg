<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" width="880" height="128" role="img" aria-label="Animated GitHub contribution snake">
  <title>Rimjhim's contribution snake</title>
  <desc>A blue snake travels across the complete GitHub contribution grid in a serpentine path.</desc>
  <style>
    .c { shape-rendering: geometricPrecision; }
    .snake {
      fill: none;
      stroke: #60a5fa;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 110 16 110 16 110 16 110 5432;
      stroke-dashoffset: 0;
      animation: moveSnake 18s linear infinite;
    }
    @keyframes moveSnake {
      to { stroke-dashoffset: -5920px; }
    }
  </style>
