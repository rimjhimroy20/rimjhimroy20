name: Generate Snake Animation

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: rimjhimroy20
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#60a5fa
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#60a5fa
            dist/github-contribution-grid-snake.gif?color_snake=#60a5fa&color_background=#0d1117

      - name: Publish generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
